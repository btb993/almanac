<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2a1838">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Daily Almanac</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Caveat:wght@500;700&family=Cinzel:wght@500;700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400;1,7..72,600&family=Manrope:wght@400;500;700;800&family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Press+Start+2P&family=Special+Elite&display=swap">
<style>
/* VOICE everyday and calm; each room of the almanac has its own character
   IDEA a printed almanac bound from five different papers: curiosity cabinet, broadsheet, star atlas, record-shop posters, corkboard
   PICTURE Today: the real moon over a night band; News: a masthead and lead story; Sky: your birth wheel in gold; Releases: sleeves, covers and tickets
   COLOUR plum night and coral (today), newsprint and red (news), ink-blue and gold (sky), pink, mustard, blue and red bands (releases), cork (saved)
   TYPE Literata + Manrope base; Playfair for news, Cinzel for sky, Anton for posters, Caveat for handwriting, Special Elite for archives
   LAYOUT slim bar with tabs (bottom bar on phones), each view owns its full-bleed hero; two columns over 900px, one column on phones */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#141017);--card:light-dark(#f5f2f7,#1f1924);--ink:light-dark(#1d1622,#efe9f2);--mute:light-dark(#6a6072,#a99fb1);--line:light-dark(#e2dae8,#352c3c);--acc:#ff6b5a;--acc-ink:light-dark(#c63a2b,#ff8a7c);--barbg:#2a1838;--barink:#f6f0fa;--moon:#f4efe6;--lit:"Literata",Georgia,serif;--ui:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--ui);overflow-x:clip;padding-bottom:calc(72px + env(safe-area-inset-bottom,0px));transition:background .3s}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
img{max-width:100%}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.full{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* bar */
header.bar{position:sticky;top:0;z-index:30;background:var(--barbg);color:var(--barink);padding-top:env(safe-area-inset-top,0px)}
.barin{display:flex;align-items:center;gap:12px;min-height:56px}
.brand{font:600 22px/1 var(--lit);text-decoration:none;letter-spacing:-.01em;white-space:nowrap}
.bdate{font-size:13px;opacity:.75;white-space:nowrap}
.gear{margin-left:auto;width:44px;height:44px;border-radius:50%;border:0;background:transparent;color:inherit;cursor:pointer;display:grid;place-items:center}
.gear:hover{background:color-mix(in srgb,currentColor 14%,transparent)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bg);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;min-height:56px;text-decoration:none;font-size:12px;font-weight:700;color:var(--mute)}
nav.tabs a svg{width:22px;height:22px}
nav.tabs a[aria-current=page]{color:var(--acc-ink)}
@media(min-width:760px){body{padding-bottom:0}nav.tabs{position:static;background:transparent;border:0;padding:0;margin-left:16px;gap:2px}nav.tabs a{flex:none;flex-direction:row;gap:7px;font-size:15px;padding:0 14px;min-height:56px;color:inherit;opacity:.7;border-bottom:3px solid transparent}nav.tabs a[aria-current=page]{opacity:1;color:inherit;border-bottom-color:var(--acc)}nav.tabs a:hover{opacity:1}nav.tabs a svg{width:18px;height:18px}}
@media(max-width:759px){.bdate{display:none}}

/* shared bits */
.label{font-size:13px;font-weight:800;margin:0 0 8px;color:var(--acc-ink)}
.tools{position:absolute;top:10px;right:8px;display:flex;gap:2px;z-index:2}
.ib{width:40px;height:40px;border-radius:10px;border:0;background:transparent;color:inherit;opacity:.65;cursor:pointer;display:grid;place-items:center}
.ib:hover{opacity:1;background:color-mix(in srgb,currentColor 10%,transparent)}
.ib.on{opacity:1;color:var(--acc)}
.ib svg{width:20px;height:20px}
.muted{color:var(--mute)}
.small{font-size:14px}
.err{font-size:14px;opacity:.75;padding:10px 0}
.skel{height:150px;border-radius:14px;background:linear-gradient(90deg,color-mix(in srgb,currentColor 6%,transparent),color-mix(in srgb,currentColor 12%,transparent),color-mix(in srgb,currentColor 6%,transparent));background-size:200% 100%;animation:sh 1.4s infinite linear}
@keyframes sh{to{background-position:-200% 0}}
.btn{border:0;border-radius:12px;padding:11px 18px;min-height:44px;font-weight:700;cursor:pointer;background:var(--ink);color:var(--bg);text-decoration:none;display:inline-flex;align-items:center}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.acc{background:var(--acc);color:#1d0f0c}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.empty{text-align:center;padding:48px 16px}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#1d1622;color:#fff;padding:10px 18px;border-radius:999px;font-weight:700;font-size:14px;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
table{border-collapse:collapse;width:100%;font-size:15px}
td,th{padding:9px 6px;border-bottom:1px solid var(--line);text-align:left}
th{font-size:13px;opacity:.7}
.scroll{overflow-x:auto}

/* ============ TODAY: cabinet of curiosities ============ */
.hero-t{background:radial-gradient(120% 140% at 85% 0%,#5a3473 0%,#2a1838 55%,#1a0f24 100%);color:#f6f0fa;position:relative;overflow:hidden}
.hero-t .stars{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.ht{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:center;padding-block:clamp(26px,5vw,56px)}
.ht .kick{margin:0 0 6px;color:#d9cce3;font-size:15px}
.ht h1{font:600 clamp(32px,5.4vw,56px)/1.04 var(--lit);letter-spacing:-.02em;margin:0 0 14px;text-wrap:balance}
.oneline{font:italic 400 clamp(17px,2vw,20px)/1.45 var(--lit);color:#f3e7f8;margin:0 0 16px;max-width:46ch}
.oneline b{font-style:normal;color:#ffb3a8;font-weight:600}
.meta{display:flex;flex-wrap:wrap;gap:8px}
.meta span{background:rgba(255,255,255,.1);border-radius:999px;padding:6px 12px;font-size:14px;white-space:nowrap}
.bigmoon{margin:0;text-align:center;width:clamp(110px,20vw,210px)}
.bigmoon svg{width:100%;height:auto;display:block;filter:drop-shadow(0 0 30px rgba(244,239,230,.3))}
.bigmoon figcaption{font-size:14px;color:#e5d8ee;margin-top:10px}
.bigmoon figcaption b{display:block;font:600 17px/1.2 var(--lit);color:#fff}
.tgrid{display:grid;gap:18px;grid-template-columns:minmax(0,1fr);padding-block:22px}
.col{display:grid;gap:18px;align-content:start}
@media(min-width:900px){.tgrid{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}}
.pane{position:relative;border-radius:18px;padding:22px 24px}
.c-fact{background:var(--acc);color:#2a0d08}
.c-fact .label{color:#2a0d08;opacity:.8}
.c-fact .q{font:600 clamp(21px,2.4vw,26px)/1.35 var(--lit);margin:0;padding-right:72px;text-wrap:pretty}
.c-fact .q::before{content:"\201C";display:block;font:900 72px/.6 "Playfair Display",Georgia,serif;opacity:.35;margin-bottom:6px}
.c-poem{background:light-dark(#fffcf6,#1d1820);border:1px solid light-dark(#e9e0cf,#3a3040);padding:30px clamp(22px,4vw,44px) 34px;box-shadow:0 1px 0 light-dark(#e9e0cf,#3a3040),0 6px 0 -3px light-dark(#fffcf6,#1d1820),0 7px 0 -3px light-dark(#e9e0cf,#3a3040)}
.c-poem .label{text-align:center}
.c-poem h3{font:italic 600 clamp(24px,3vw,30px)/1.15 var(--lit);text-align:center;margin:4px 0 4px;text-wrap:balance}
.c-poem .by{text-align:center;color:var(--mute);margin:0 0 20px;font-size:15px}
.c-poem .orn{text-align:center;color:var(--acc-ink);margin:-8px 0 18px;font-size:18px}
.c-poem .verse{font:400 17.5px/1.75 var(--lit);white-space:pre-wrap;max-width:34em;margin:0 auto}
.c-poem .verse::first-letter{float:left;font:600 3.4em/.8 "Playfair Display",Georgia,serif;margin:.08em .1em 0 0;color:var(--acc-ink)}
.c-hist{background:light-dark(#efe3c9,#2a2318);color:light-dark(#2d2416,#ede0c6);overflow:hidden}
.c-hist .label{color:light-dark(#8a2a1a,#ff9b85)}
.c-hist h3{font:400 24px/1.2 "Special Elite","Courier New",monospace;margin:0 0 4px;padding-right:130px}
.c-hist .where{font-size:14px;opacity:.75;margin:0 0 14px;padding-right:120px}
.c-hist p.body{font:400 15.5px/1.65 "Special Elite","Courier New",monospace;margin:0}
.stamp{position:absolute;top:44px;right:22px;transform:rotate(-9deg);border:3px solid #b3261e;color:#b3261e;border-radius:8px;padding:4px 10px;font:400 26px/1 "Special Elite",monospace;opacity:.85;mix-blend-mode:multiply}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .stamp{mix-blend-mode:normal;color:#ff8a7c;border-color:#ff8a7c}}
:root[data-theme=dark] .stamp{mix-blend-mode:normal;color:#ff8a7c;border-color:#ff8a7c}
.c-word{background:var(--bg);border-top:4px double var(--ink);border-bottom:1px solid var(--ink);border-radius:0;padding:18px 4px 20px}
.c-word .hw{font:italic 700 clamp(36px,5vw,48px)/1 "Playfair Display",Georgia,serif;margin:0}
.c-word .pos{font:italic 400 16px var(--lit);color:var(--mute);margin:6px 0 12px}
.c-word .def{font:400 18px/1.5 var(--lit);margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px}
.c-word .def b{color:var(--acc-ink)}
.c-otd{background:var(--card)}
.tl{list-style:none;margin:0;padding:0;position:relative}
.tl::before{content:"";position:absolute;left:3.2em;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl li{display:grid;grid-template-columns:3.2em minmax(0,1fr);gap:18px;padding:7px 0;position:relative}
.tl li::after{content:"";position:absolute;left:calc(3.2em - 4px);top:15px;width:10px;height:10px;border-radius:50%;background:var(--acc)}
.tl b{font:600 17px/1.4 var(--lit);text-align:right;font-variant-numeric:tabular-nums}
.c-q{background:light-dark(#fffef7,#1b1a14);background-image:repeating-linear-gradient(transparent 0 35px,light-dark(#cfe0f0,#2c3440) 35px 36px);border-left:0;padding-top:20px}
.c-q .hand{font:500 clamp(26px,3vw,32px)/36px "Caveat",cursive;margin:0;padding-right:40px;color:light-dark(#22325c,#cddcff)}
.streak{display:flex;gap:5px;margin-top:16px;flex-wrap:wrap}
.streak i{width:20px;height:20px;border-radius:50%;border:2px solid light-dark(#22325c,#cddcff);opacity:.35}
.streak i.on{background:var(--acc);border-color:var(--acc);opacity:1}
.tgrid2{display:grid;gap:18px;grid-template-columns:minmax(0,1fr);padding-bottom:22px}
@media(min-width:900px){.tgrid2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.c-art{background:#2b2622;color:#efe8df;text-align:center;padding:26px 22px}
.c-art .label{color:#e7c98f;text-align:left}
.frame{display:inline-block;padding:12px;background:linear-gradient(135deg,#c9a45c,#8a6a2c 45%,#d8b86e 60%,#7a5c22);box-shadow:0 18px 30px -12px rgba(0,0,0,.6);margin:6px 0 18px;max-width:100%}
.frame .mat{background:#f4efe4;padding:clamp(10px,2vw,18px)}
.frame img{display:block;max-height:360px;width:auto;max-width:100%;margin:0 auto}
.plaque{background:#f4efe4;color:#2b2622;display:inline-block;text-align:left;padding:10px 14px;border-radius:2px;max-width:420px;font-size:14px}
.plaque b{font:italic 600 16px/1.3 var(--lit);display:block}
.c-apod{background:#05060d;color:#e8ecff;overflow:hidden;padding:0}
.c-apod .in{padding:18px 22px 22px}
.c-apod img{width:100%;display:block;max-height:420px;object-fit:cover}
.c-apod .label{color:#9fb4ff}
.c-apod h3{font:600 22px/1.2 var(--lit);margin:0 0 8px;padding-right:44px}
.c-read{background:var(--card);display:grid;gap:20px;grid-template-columns:minmax(0,1fr);margin-bottom:28px;align-items:center}
@media(min-width:760px){.c-read.has{grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr)}}
.c-read img{width:100%;border-radius:12px;display:block;max-height:340px;object-fit:cover}
.c-read h3{font:600 clamp(24px,3vw,32px)/1.12 var(--lit);margin:0 0 10px;padding-right:44px}
.c-read p{margin:0 0 12px;font:400 17px/1.6 var(--lit)}
@media(max-width:600px){.ht{grid-template-columns:minmax(0,1fr)}.bigmoon{grid-row:1;justify-self:start;display:flex;align-items:center;gap:14px;width:auto;text-align:left}.bigmoon svg{width:76px}.bigmoon figcaption{margin:0}.stamp{top:auto;bottom:16px;font-size:20px}.c-hist h3,.c-hist .where{padding-right:80px}.c-hist p.body{padding-bottom:28px}}

/* ============ NEWS: broadsheet ============ */
body[data-v=news]{--bg:light-dark(#f4f0e8,#161513);--card:light-dark(#ebe5da,#22201c);--ink:light-dark(#121212,#ece7dd);--mute:light-dark(#5b564d,#a9a294);--line:light-dark(#12121233,#ece7dd30);--acc:#c4161c;--acc-ink:light-dark(#b0141a,#ff6b6b);--barbg:light-dark(#121212,#0b0b0a);--barink:#f4f0e8}
.mast-n{text-align:center;padding:26px 0 0}
.ear{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--mute);border-bottom:1px solid var(--ink);padding-bottom:8px;flex-wrap:wrap}
.mast-n h1{font:900 clamp(40px,8vw,92px)/1 "Playfair Display",Georgia,serif;letter-spacing:-.02em;margin:14px 0 10px}
.dl{border-top:3px solid var(--ink);border-bottom:1px solid var(--ink);padding:8px 0;font:italic 400 15px var(--lit);display:flex;justify-content:center;gap:6px 18px;flex-wrap:wrap}
.secnav{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;padding:12px 0 4px}
.secnav button{border:0;background:transparent;padding:8px 12px;min-height:40px;cursor:pointer;font:700 14px var(--ui);border-bottom:2px solid transparent}
.secnav button[aria-pressed=true]{border-bottom-color:var(--acc);color:var(--acc-ink)}
.nsearch{display:flex;justify-content:center;padding:6px 0 10px}
.nsearch input{max-width:420px;width:100%;font-size:16px;padding:10px 14px;border:1px solid var(--line);border-radius:999px;background:var(--bg);min-height:44px}
.nsec{border-top:4px solid var(--ink);margin-top:26px;padding-top:6px}
.nsec>h2{font:900 26px/1.2 "Playfair Display",Georgia,serif;margin:0 0 14px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.nsec>h2 small{font:400 13px var(--ui);color:var(--mute)}
.paper{display:grid;gap:0 26px;grid-template-columns:minmax(0,1fr)}
@media(min-width:760px){.paper{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(min-width:1040px){.paper{grid-template-columns:repeat(3,minmax(0,1fr))}}
.story{position:relative;padding:12px 0 14px;border-bottom:1px solid var(--line)}
.story h3{font:700 19px/1.25 "Playfair Display",Georgia,serif;margin:0 0 6px;padding-right:36px}
.story h3 a{text-decoration:none}
.story h3 a:hover{text-decoration:underline}
.story p{margin:0 0 6px;font:400 15px/1.5 var(--lit);color:var(--mute)}
.story .by{font-size:12.5px;color:var(--mute);font-weight:700}
.story img{width:100%;aspect-ratio:3/2;object-fit:cover;display:block;margin-bottom:10px;filter:saturate(.85)}
.story .ib{position:absolute;top:6px;right:-6px}
.story.lead{grid-column:1/-1;display:grid;gap:18px;grid-template-columns:minmax(0,1fr);border-bottom:2px solid var(--ink)}
@media(min-width:760px){.story.lead.has{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}}
.story.lead h3{font:900 clamp(26px,3.4vw,38px)/1.08 "Playfair Display",Georgia,serif}
.story.lead p{font-size:17px;color:var(--ink)}
.story.lead img{margin:0}

/* ============ SKY: star atlas ============ */
body[data-v=sky]{color-scheme:dark;--bg:#0c0a22;--card:#16123a;--ink:#ece7ff;--mute:#aaa2d6;--line:#ffffff1f;--acc:#e8c873;--acc-ink:#f0d48a;--barbg:#0c0a22;--barink:#ece7ff;background:radial-gradient(ellipse at 70% -10%,#2a1f63 0%,#0c0a22 55%) fixed,#0c0a22}
body[data-v=sky] .skystars{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.skyv{position:relative;z-index:1;padding-block:26px 40px}
.skyv h1{font:700 clamp(32px,5vw,54px)/1.05 "Cinzel",Georgia,serif;margin:0 0 6px;color:#f3e2ad}
.skyv h2{font:500 clamp(22px,2.6vw,28px)/1.2 "Cinzel",Georgia,serif;margin:0 0 14px;color:#f3e2ad}
.skyv .sub{color:var(--mute);margin:0 0 22px}
.skyhero{display:grid;gap:24px;grid-template-columns:minmax(0,1fr);align-items:center}
@media(min-width:900px){.skyhero{grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr)}}
.wheel svg{width:100%;max-width:580px;height:auto;display:block;margin:0 auto}
.big3{display:grid;gap:12px}
.big3 div{border:1px solid #e8c87355;border-radius:16px;padding:14px 18px;background:#ffffff08}
.big3 small{color:var(--mute);font-size:13px;display:block}
.big3 b{font:700 26px/1.15 "Cinzel",Georgia,serif;color:#f3e2ad;display:flex;align-items:center;gap:10px}
.big3 b span{font-size:30px;font-family:"Segoe UI Symbol","Noto Sans Symbols","Apple Symbols",sans-serif}
.big3 p{margin:4px 0 0;font:italic 400 16px/1.45 var(--lit)}
.glass{background:#ffffff0a;border:1px solid #ffffff1a;border-radius:20px;padding:20px 22px}
.skygrid{display:grid;gap:20px;grid-template-columns:minmax(0,1fr);margin-top:28px}
@media(min-width:900px){.skygrid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.asp{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.asp h4{margin:0 0 3px;font-size:16px}
.asp p{margin:0;color:var(--mute);font-size:15px}
.tag{display:inline-block;font-size:12px;font-weight:700;border-radius:6px;padding:1px 7px;margin-left:6px;vertical-align:2px}
.t-hard{background:#ff6b5a33;color:#ffa79c}
.t-soft{background:#7fa8ff33;color:#b5ccff}
.t-conj{background:#e8c87333;color:#f3e2ad}
.reading{list-style:none;margin:0;padding:0;display:grid;gap:0;grid-template-columns:minmax(0,1fr)}
@media(min-width:760px){.reading{grid-template-columns:repeat(2,minmax(0,1fr));column-gap:24px}}
.reading li{display:grid;grid-template-columns:2.2em minmax(0,1fr);gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.reading .gl{font:28px/1 "Segoe UI Symbol","Noto Sans Symbols","Apple Symbols",sans-serif;color:#f3e2ad;text-align:center}
.reading h4{margin:0 0 2px;font:700 15px var(--ui)}
.reading p{margin:0;font-size:15px;color:var(--mute)}
.route{list-style:none;margin:0;padding:0;position:relative}
.route::before{content:"";position:absolute;left:27px;top:10px;bottom:10px;width:1px;background:linear-gradient(#e8c873,#e8c87322)}
.route li{display:grid;grid-template-columns:56px minmax(0,1fr);gap:14px;padding:10px 0;position:relative}
.route .disc{width:56px;height:56px;border-radius:50%;border:1px solid #e8c873;background:#0c0a22;display:grid;place-items:center;text-align:center;line-height:1}
.route .disc b{font:700 20px "Cinzel",serif;color:#f3e2ad}
.route .disc small{font-size:11px;color:var(--mute);display:block;margin-top:2px}
.route h4{margin:6px 0 3px;font-size:16px}
.route p{margin:0;color:var(--mute);font-size:15px}
.route .mo{font:500 15px "Cinzel",serif;color:#f3e2ad;padding:16px 0 4px 70px;display:block}
.skyv td,.skyv th{border-color:var(--line)}

<script>
{
// ---------- storage (falls back to memory if the browser blocks it) ----------
const STORE_OK=(()=>{try{localStorage.setItem('alm:t','1');const ok=localStorage.getItem('alm:t')==='1';localStorage.removeItem('alm:t');return ok}catch(e){return false}})();
const MEM={};
const LS={get(k,d){try{const v=STORE_OK?localStorage.getItem('alm:'+k):MEM[k];return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){const s=JSON.stringify(v);MEM[k]=s;if(STORE_OK)try{localStorage.setItem('alm:'+k,s)}catch(e){}},keys(){try{return STORE_OK?Object.keys(localStorage).filter(k=>k.startsWith('alm:c:')):[]}catch(e){return[]}}};
const DEF={name:'',birth:{date:'',time:'',noTime:false,place:'',lat:null,lon:null,tz:''},topics:['science','nature','space','technology','history','upside'],custom:[],hn:true,wiki:true,artists:[],authors:[],gameGenres:[],rel:{music:true,books:true,games:true,film:true},keys:{guardian:'',nasa:'',rawg:''}};
const loadS=o=>{const s=Object.assign({},DEF,o||{});s.birth=Object.assign({},DEF.birth,s.birth||{});s.keys=Object.assign({},DEF.keys,s.keys||{});s.rel=Object.assign({},DEF.rel,s.rel||{});['topics','custom','artists','authors','gameGenres'].forEach(k=>{if(!Array.isArray(s[k]))s[k]=DEF[k]});return s};
let S=loadS(LS.get('settings',{}));

// ---------- helpers ----------

const strip=h=>{try{return new DOMParser().parseFromString(h||'','text/html').body.textContent||''}catch(e){return ''}};
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),1800)};
const now=new Date();
const ymd=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const TODAY=ymd(now);
const DAYN=Math.floor(new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime()/864e5);
const fmtDate=(d,o)=>new Date(d).toLocaleDateString(undefined,o||{weekday:'short',day:'numeric',month:'short'});
const ago=iso=>{const m=(Date.now()-new Date(iso))/6e4;if(!isFinite(m))return '';if(m<60)return Math.max(1,Math.round(m))+' min ago';if(m<1440)return Math.round(m/60)+' h ago';return fmtDate(iso,{day:'numeric',month:'short'})};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const wikiPath=()=>`${now.getFullYear()}/${String(now.getMonth()+1).padStart(2,'0')}/${String(now.getDate()).padStart(2,'0')}`;
async function getJSON(url,key,hours){
  const c=LS.get('c:'+key,null);
  if(c&&Date.now()-c.t<hours*36e5)return c.v;
  try{const ac=new AbortController();const to=setTimeout(()=>ac.abort(),15000);const r=await fetch(url,{signal:ac.signal});clearTimeout(to);if(!r.ok)throw new Error('HTTP '+r.status);const v=await r.json();LS.set('c:'+key,{t:Date.now(),v});return v}
  catch(e){if(c)return c.v;throw e}

const BM='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3h12v18l-6-4-6 4z"/></svg>';

const SHUF='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>';

const isSaved=id=>saved.some(s=>s.id===id);
const REG={};
function saveBtn(item){REG[item.id]=item;const on=isSaved(item.id);return `<button class="ib${on?' on':''}" data-save="${esc(item.id)}" aria-label="${on?'Remove from saved':'Save'}" title="${on?'Saved':'Save'}">${on?BMF:BM}</button>`}

const genBg=s=>`linear-gradient(135deg,hsl(${hue(s)} 70% 45%),hsl(${(hue(s)+60)%360} 70% 30%))`;

// ---------- content ----------
const POEMS=[
["Sonnet 18","William Shakespeare",`Shall I compare thee to a summer's day?

Sometime too hot the eye of heaven shines,
And often is his gold complexion dimm'd;
And every fair from fair sometime declines,
By chance or nature's changing course untrimm'd;
But thy eternal summer shall not fade,
Nor lose possession of that fair thou ow'st;
Nor shall Death brag thou wander'st in his shade,
When in eternal lines to time thou grow'st:
So long as men can breathe or eyes can see,
So long lives this, and this gives life to thee.`],
["“Hope” is the thing with feathers","Emily Dickinson",`"Hope" is the thing with feathers -
That perches in the soul -
And sings the tune without the words -
And never stops - at all -

And sweetest - in the Gale - is heard -
And sore must be the storm -
That could abash the little Bird
That kept so many warm -

I've heard it in the chillest land -
And on the strangest Sea -
Yet - never - in Extremity,
It asked a crumb - of me.`],
["I wandered lonely as a cloud","William Wordsworth",`I wandered lonely as a cloud
That floats on high o'er vales and hills,
When all at once I saw a crowd,
A host, of golden daffodils;
Beside the lake, beneath the trees,
Fluttering and dancing in the breeze.

Continuous as the stars that shine
And twinkle on the milky way,
They stretched in never-ending line
Along the margin of a bay:
Ten thousand saw I at a glance,
Tossing their heads in sprightly dance.

The waves beside them danced; but they
Out-did the sparkling waves in glee:
A poet could not but be gay,
In such a jocund company:
I gazed—and gazed—but little thought
What wealth the show to me had brought:

For oft, when on my couch I lie
In vacant or in pensive mood,
They flash upon that inward eye
Which is the bliss of solitude;
And then my heart with pleasure fills,
And dances with the daffodils.`],
["Nothing Gold Can Stay","Robert Frost",`Nature's first green is gold,
Her hardest hue to hold.
Her early leaf's a flower;
But only so an hour.
Then leaf subsides to leaf.
So Eden sank to grief,
So dawn goes down to day.
Nothing gold can stay.`],
["Fire and Ice","Robert Frost",`Some say the world will end in fire,
Some say in ice.
From what I've tasted of desire
I hold with those who favor fire.
But if it had to perish twice,
I think I know enough of hate
To say that for destruction ice
Is also great
And would suffice.`],
["Stopping by Woods on a Snowy Evening","Robert Frost",`Whose woods these are I think I know.
His house is in the village though;
He will not see me stopping here
To watch his woods fill up with snow.

My little horse must think it queer
To stop without a farmhouse near
Between the woods and frozen lake
The darkest evening of the year.

He gives his harness bells a shake
To ask if there is some mistake.
The only other sound's the sweep
Of easy wind and downy flake.

The woods are lovely, dark and deep,
But I have promises to keep,
And miles to go before I sleep,
And miles to go before I sleep.`],
["The Road Not Taken","Robert Frost",`Two roads diverged in a yellow wood,
And sorry I could not travel both
And be one traveler, long I stood
And looked down one as far as I could
To where it bent in the undergrowth;

Then took the other, as just as fair,
And having perhaps the better claim,
Because it was grassy and wanted wear;
Though as for that the passing there
Had worn them really about the same,

And both that morning equally lay
In leaves no step had trodden black.
Oh, I kept the first for another day!
Yet knowing how way leads on to way,
I doubted if I should ever come back.

I shall be telling this with a sigh
Somewhere ages and ages hence:
Two roads diverged in a wood, and I—
I took the one less traveled by,
And that has made all the difference.`],
["When You Are Old","W. B. Yeats",`When you are old and grey and full of sleep,
And nodding by the fire, take down this book,
And slowly read, and dream of the soft look
Your eyes had once, and of their shadows deep;

How many loved your moments of glad grace,
And loved your beauty with love false or true,
But one man loved the pilgrim soul in you,
And loved the sorrows of your changing face;

And bending down beside the glowing bars,
Murmur, a little sadly, how Love fled
And paced upon the mountains overhead
And hid his face amid a crowd of stars.`],
["The Lake Isle of Innisfree","W. B. Yeats",`I will arise and go now, and go to Innisfree,
And a small cabin build there, of clay and wattles made;
Nine bean-rows will I have there, a hive for the honey-bee,
And live alone in the bee-loud glade.

And I shall have some peace there, for peace comes dropping slow,
Dropping from the veils of the morning to where the cricket sings;
There midnight's all a glimmer, and noon a purple glow,
And evening full of the linnet's wings.

I will arise and go now, for always night and day
I hear lake water lapping with low sounds by the shore;
While I stand on the roadway, or on the pavements grey,
I hear it in the deep heart's core.`],
["Ozymandias","Percy Bysshe Shelley",`I met a traveller from an antique land,
Who said—"Two vast and trunkless legs of stone
Stand in the desert. . . . Near them, on the sand,
Half sunk a shattered visage lies, whose frown,
And wrinkled lip, and sneer of cold command,
Tell that its sculptor well those passions read
Which yet survive, stamped on these lifeless things,
The hand that mocked them, and the heart that fed;
And on the pedestal, these words appear:
My name is Ozymandias, King of Kings;
Look on my Works, ye Mighty, and despair!
Nothing beside remains. Round the decay
Of that colossal Wreck, boundless and bare
The lone and level sands stretch far away."`],
["Bright Star","John Keats",`Bright star, would I were stedfast as thou art—
Not in lone splendour hung aloft the night
And watching, with eternal lids apart,
Like nature's patient, sleepless Eremite,
The moving waters at their priestlike task
Of pure ablution round earth's human shores,
Or gazing on the new soft-fallen mask
Of snow upon the mountains and the moors—
No—yet still stedfast, still unchangeable,
Pillow'd upon my fair love's ripening breast,
To feel for ever its soft fall and swell,
Awake for ever in a sweet unrest,
Still, still to hear her tender-taken breath,
And so live ever—or else swoon to death.`],
["Remember","Christina Rossetti",`Remember me when I am gone away,
Gone far away into the silent land;
When you can no more hold me by the hand,
Nor I half turn to go yet turning stay.
Remember me when no more day by day
You tell me of our future that you planned:
Only remember me; you understand
It will be late to counsel then or pray.
Yet if you should forget me for a while
And afterwards remember, do not grieve:
For if the darkness and corruption leave
A vestige of the thoughts that once I had,
Better by far you should forget and smile
Than that you should remember and be sad.`],
["Crossing the Bar","Alfred, Lord Tennyson",`Sunset and evening star,
And one clear call for me!
And may there be no moaning of the bar,
When I put out to sea,

But such a tide as moving seems asleep,
Too full for sound and foam,
When that which drew from out the boundless deep
Turns again home.

Twilight and evening bell,
And after that the dark!
And may there be no sadness of farewell,
When I embark;

For tho' from out our bourne of Time and Place
The flood may bear me far,
I hope to see my Pilot face to face
When I have crost the bar.`],
["A Noiseless Patient Spider","Walt Whitman",`A noiseless patient spider,
I mark'd where on a little promontory it stood isolated,
Mark'd how to explore the vacant vast surrounding,
It launch'd forth filament, filament, filament, out of itself,
Ever unreeling them, ever tirelessly speeding them.

And you O my soul where you stand,
Surrounded, detached, in measureless oceans of space,
Ceaselessly musing, venturing, throwing, seeking the spheres to connect them,
Till the bridge you will need be form'd, till the ductile anchor hold,
Till the gossamer thread you fling catch somewhere, O my soul.`],
["There Will Come Soft Rains","Sara Teasdale",`There will come soft rains and the smell of the ground,
And swallows circling with their shimmering sound;

And frogs in the pools singing at night,
And wild plum trees in tremulous white;

Robins will wear their feathery fire,
Whistling their whims on a low fence-wire;

And not one will know of the war, not one
Will care at last when it is done.

Not one would mind, neither bird nor tree,
If mankind perished utterly;

And Spring herself, when she woke at dawn
Would scarcely know that we were gone.`],
["Loveliest of trees, the cherry now","A. E. Housman",`Loveliest of trees, the cherry now
Is hung with bloom along the bough,
And stands about the woodland ride
Wearing white for Eastertide.

Now, of my threescore years and ten,
Twenty will not come again,
And take from seventy springs a score,
It only leaves me fifty more.

And since to look at things in bloom
Fifty springs are little room,
About the woodlands I will go
To see the cherry hung with snow.`],
["The Tyger","William Blake",`Tyger Tyger, burning bright,
In the forests of the night;
What immortal hand or eye,
Could frame thy fearful symmetry?

In what distant deeps or skies.
Burnt the fire of thine eyes?
On what wings dare he aspire?
What the hand, dare seize the fire?

And what shoulder, & what art,
Could twist the sinews of thy heart?
And when thy heart began to beat,
What dread hand? & what dread feet?

What the hammer? what the chain,
In what furnace was thy brain?
What the anvil? what dread grasp,
Dare its deadly terrors clasp!

When the stars threw down their spears
And water'd heaven with their tears:
Did he smile his work to see?
Did he who made the Lamb make thee?

Tyger Tyger burning bright,
In the forests of the night:
What immortal hand or eye,
Dare frame thy fearful symmetry?`],
["Because I could not stop for Death","Emily Dickinson",`Because I could not stop for Death –
He kindly stopped for me –
The Carriage held but just Ourselves –
And Immortality.

We slowly drove – He knew no haste
And I had put away
My labor and my leisure too,
For His Civility –

We passed the School, where Children strove
At Recess – in the Ring –
We passed the Fields of Gazing Grain –
We passed the Setting Sun –

Or rather – He passed us –
The Dews drew quivering and chill –
For only Gossamer, my Gown –
My Tippet – only Tulle –

We paused before a House that seemed
A Swelling of the Ground –
The Roof was scarcely visible –
The Cornice – in the Ground –

Since then – 'tis Centuries – and yet
Feels shorter than the Day
I first surmised the Horses' Heads
Were toward Eternity –`],
["To the Virgins, to Make Much of Time","Robert Herrick",`Gather ye rosebuds while ye may,
Old Time is still a-flying;
And this same flower that smiles today
Tomorrow will be dying.

The glorious lamp of heaven, the sun,
The higher he's a-getting,
The sooner will his race be run,
And nearer he's to setting.

That age is best which is the first,
When youth and blood are warmer;
But being spent, the worse, and worst
Times still succeed the former.

Then be not coy, but use your time,
And while ye may, go marry;
For having lost but once your prime,
You may forever tarry.`],
["A Red, Red Rose","Robert Burns",`O my Luve is like a red, red rose
That's newly sprung in June;
O my Luve is like the melody
That's sweetly play'd in tune.

So fair art thou, my bonnie lass,
So deep in luve am I;
And I will luve thee still, my dear,
Till a' the seas gang dry.

Till a' the seas gang dry, my dear,
And the rocks melt wi' the sun;
I will luve thee still, my dear,
While the sands o' life shall run.

And fare thee weel, my only luve!
And fare thee weel awhile!
And I will come again, my luve,
Though it were ten thousand mile.`],
["Sonnet 116","William Shakespeare",`Let me not to the marriage of true minds
Admit impediments. Love is not love
Which alters when it alteration finds,
Or bends with the remover to remove.
O no! it is an ever-fixed mark
That looks on tempests and is never shaken;
It is the star to every wand'ring bark,
Whose worth's unknown, although his height be taken.
Love's not Time's fool, though rosy lips and cheeks
Within his bending sickle's compass come;
Love alters not with his brief hours and weeks,
But bears it out even to the edge of doom.
If this be error and upon me prov'd,
I never writ, nor no man ever lov'd.`],
["She Walks in Beauty","Lord Byron",`She walks in beauty, like the night
Of cloudless climes and starry skies;
And all that's best of dark and bright
Meet in her aspect and her eyes;
Thus mellowed to that tender light
Which heaven to gaudy day denies.

One shade the more, one ray the less,
Had half impaired the nameless grace
Which waves in every raven tress,
Or softly lightens o'er her face;
Where thoughts serenely sweet express,
How pure, how dear their dwelling-place.

And on that cheek, and o'er that brow,
So soft, so calm, yet eloquent,
The smiles that win, the tints that glow,
But tell of days in goodness spent,
A mind at peace with all below,
A heart whose love is innocent!`],
["Tell all the truth but tell it slant","Emily Dickinson",`Tell all the truth but tell it slant —
Success in Circuit lies
Too bright for our infirm Delight
The Truth's superb surprise
As Lightning to the Children eased
With explanation kind
The Truth must dazzle gradually
Or every man be blind —`],
["Requiem","Robert Louis Stevenson",`Under the wide and starry sky,
Dig the grave and let me lie.
Glad did I live and gladly die,
And I laid me down with a will.

This be the verse you grave for me:
Here he lies where he longed to be;
Home is the sailor, home from sea,
And the hunter home from the hill.`],
["Pied Beauty","Gerard Manley Hopkins",`Glory be to God for dappled things –
For skies of couple-colour as a brinded cow;
For rose-moles all in stipple upon trout that swim;
Fresh-firecoal chestnut-falls; finches' wings;
Landscape plotted and pieced – fold, fallow, and plough;
And all trades, their gear and tackle and trim.

All things counter, original, spare, strange;
Whatever is fickle, freckled (who knows how?)
With swift, slow; sweet, sour; adazzle, dim;
He fathers-forth whose beauty is past change:
Praise him.`],
["Auguries of Innocence (opening)","William Blake",`To see a World in a Grain of Sand
And a Heaven in a Wild Flower
Hold Infinity in the palm of your hand
And Eternity in an hour`]

const HISTORY=[
["The Great Molasses Flood","Boston, 1919","A huge storage tank on Boston's waterfront burst on a mild January day and released about 8.7 million litres of molasses. A brown wave several metres high swept through the North End at an estimated 50 km/h, flattening buildings and killing 21 people. Residents claimed the area smelled sweet on hot days for decades. The disaster led to stricter rules on engineering calculations and building permits."],
["The Dancing Plague","Strasbourg, 1518","In July 1518 a woman began dancing in the street and could not stop. Within weeks dozens of others had joined her. The authorities first decided the cure was more dancing and hired musicians and a stage, which only made things worse. Historians still debate the cause, from mass stress during famine to religious fear of a curse linked to Saint Vitus."],
["The Christmas Truce","Western Front, 1914","On Christmas Eve 1914, German soldiers set up candlelit trees along their trenches and sang carols. British troops answered, and along stretches of the front men climbed out into no man's land to swap cigarettes, buttons and food, bury their dead and, in some places, kick a football around. Commanders made sure it never happened on that scale again."],
["The Great Emu War","Western Australia, 1932","After the First World War, farmland in Western Australia was invaded by around 20,000 emus. The government sent soldiers armed with machine guns. The birds scattered, ran fast and proved very hard to hit, and after weeks of effort the operation was called off. The emus are generally considered to have won."],
["Semmelweis and the washed hands","Vienna, 1847","The Hungarian doctor Ignác Semmelweis noticed that far more mothers died of fever in the ward run by doctors than in the one run by midwives. Doctors often came straight from dissecting bodies. When he made them wash their hands in chlorinated lime, deaths fell dramatically. Many colleagues rejected his idea, and his insight was only fully accepted after germ theory arrived years after his death."],
["The Great Stink","London, 1858","A hot summer turned the sewage-filled Thames into an open drain, and the smell was so bad that Parliament considered moving out. Lawmakers who had delayed for years suddenly funded Joseph Bazalgette's plan for huge intercepting sewers. His tunnels and embankments still carry much of London's waste today and helped end the city's cholera outbreaks."],
["The Antikythera mechanism","Greek shipwreck, about 100 BC","Divers off the island of Antikythera in 1901 recovered a lump of corroded bronze. Over a century of study, including X-ray scans, revealed dozens of interlocking gears: a hand-cranked device that predicted the positions of the Sun and Moon, the phases of the Moon, eclipses and even the timing of the Olympic Games. Nothing as complex is known again for over a thousand years."],
["Harrison's clocks","Britain, 1730s to 1770s","Sailors could find latitude from the stars, but not longitude, and ships were lost because of it. A self-taught carpenter, John Harrison, spent decades building clocks that kept accurate time at sea. By comparing local noon with the time back home, a navigator could finally work out how far east or west they were."],
["Tulip mania","The Netherlands, 1637","In the 1630s, rare tulip bulbs with streaked petals became wildly fashionable in the Dutch Republic. Contracts for single bulbs reportedly traded for the price of a house. In February 1637 buyers suddenly stopped turning up and prices collapsed. Historians now think the damage was smaller than legend says, but the story became a byword for speculative bubbles."],
["Three towns become Budapest","Hungary, 1873","Until 1873, Buda, Óbuda and Pest were separate towns facing each other across the Danube. The Chain Bridge, opened in 1849, had linked them permanently for the first time. In 1873 they were officially merged into one city, Budapest, which grew so fast over the next few decades that it became one of Europe's great capitals."],
["The siege of Eger","Hungary, 1552","A huge Ottoman army besieged the castle of Eger, defended by about two thousand soldiers and townspeople under István Dobó. For more than a month they held out, famously helped by women who joined the defence on the walls. The besiegers finally withdrew. The story became a national legend through Géza Gárdonyi's novel Eclipse of the Crescent Moon."],
["The Carrington Event","Worldwide, 1859","On 1 September 1859 the astronomer Richard Carrington saw a brilliant flash on the Sun. Within a day, the strongest geomagnetic storm on record hit Earth. Auroras were seen near the tropics, and telegraph lines sparked; some operators found they could send messages with their batteries disconnected. A storm that size today would threaten power grids and satellites."],
["The year without a summer","Europe and North America, 1816","The eruption of Mount Tambora in Indonesia in 1815 threw so much ash and sulphur into the sky that 1816 turned cold and wet. Crops failed and food prices soared. Stuck indoors by the rain at Lake Geneva, a group of writers held a ghost-story contest, and the 18-year-old Mary Shelley began writing Frankenstein."],
["The Rosetta Stone","Egypt, 1799","French soldiers rebuilding a fort near the town of Rashid found a slab carved with the same decree in three scripts: hieroglyphs, Demotic and ancient Greek. Because scholars could read the Greek, it became the key to Egyptian writing. In 1822 Jean-François Champollion announced he had cracked the hieroglyphs."],
["Shackleton's Endurance","Antarctica, 1915 to 2022","Ernest Shackleton's ship Endurance was crushed by pack ice in 1915. Every one of the 28 men survived after camping on ice floes, sailing lifeboats to Elephant Island and making an 1,300 km open-boat crossing to South Georgia. In 2022 the wreck was found 3,000 metres down in the Weddell Sea, remarkably intact, with its name still on the stern."],
["Mansa Musa's journey","Mali to Mecca, 1324","Mansa Musa, ruler of the Mali Empire, travelled to Mecca with an enormous caravan carrying gold. In Cairo he spent and gave away so much that the value of gold there dropped for years. His journey put Mali on European maps, where he was drawn holding a golden nugget, and he funded scholarship and mosques in Timbuktu."],
["The cave of Lascaux","France, 1940","Four teenagers and a dog went looking for a rumoured tunnel near Montignac and slipped into a cave covered in paintings of horses, bulls and deer, about 17,000 years old. So many visitors came after the war that their breath damaged the paintings, and the cave was closed in 1963. Visitors now see precise replicas."],
["Apollo 13","Space, 1970","Two days into the flight to the Moon, an oxygen tank exploded. The crew moved into the lunar module, designed for two people for two days, and used it as a lifeboat for four. Engineers on the ground worked out how to fit square carbon-dioxide filters into round sockets using items on board. All three astronauts returned safely."],
["Phineas Gage","Vermont, 1848","A railway foreman, Phineas Gage, was packing explosive into a rock when it went off and drove an iron rod through his skull. He survived and could talk within minutes. Friends said his personality changed, and his case became one of the first clues that particular parts of the brain shape behaviour and self-control."],
["Gutenberg's press","Mainz, about 1450","Johannes Gutenberg combined movable metal type, oil-based ink and a press adapted from wine-making. His Bible, finished around 1455, was the first major book printed this way in Europe. Within fifty years millions of books were circulating, and ideas began to travel faster than any authority could control them."],
["The Defenestration of Prague","Bohemia, 1618","Protestant nobles angry at the Habsburgs threw two royal officials and their secretary out of a castle window in Prague. All three survived the 20-metre fall; Catholics said angels saved them, Protestants said they landed on a dung heap. The incident helped start the Thirty Years' War."],
["Graffiti of Pompeii","Roman Italy, AD 79","The ash that buried Pompeii also preserved thousands of scribbles on its walls: election slogans, advertisements, jokes, love notes and complaints about neighbours. They are some of the best evidence we have of how ordinary Romans actually wrote and thought, far from the polished speeches of senators."]

function natal(){

function transits(nat){
  const day=864e5,start=new Date(now.getFullYear(),now.getMonth(),now.getDate(),12).getTime();
  const targets=Object.keys(nat.pts).filter(k=>k!=='nn'&&!(k==='mo'&&!nat.hasAng&&S.birth.noTime));
  const out=[],today=[];
  for(const t of Object.keys(SPAN)){
    const n=SPAN[t],L=[];for(let i=0;i<=n;i++)L.push(lonOf(t,start+i*day));
    for(const p of targets){
      for(const[A,name,kind,tone]of ASP){
        for(const sgn of(A===0||A===180)?[1]:[1,-1]){
          const tgt=nat.pts[p]+sgn*A;let prev=wrap(L[0]-tgt);
          if(Math.abs(prev)<(t==='su'||t==='me'||t==='ve'?1.5:2.5))today.push({t,p,name,kind,tone,orb:Math.abs(prev)});
          for(let i=1;i<=n;i++){const f=wrap(L[i]-tgt);
            if(prev!==0&&Math.sign(f)!==Math.sign(prev)&&Math.abs(f)<20&&Math.abs(prev)<20){
              const frac=prev/(prev-f);out.push({t,p,name,kind,tone,ms:start+(i-1+frac)*day});
            }prev=f;}
        }
      }
    }
  }
  const nowMs=Date.now();
  const mo=lonOf('mo',nowMs);
  for(const p of targets)for(const[A,name,kind,tone]of ASP)for(const sgn of(A===0||A===180)?[1]:[1,-1]){const o=Math.abs(wrap(mo-nat.pts[p]-sgn*A));if(o<5)today.push({t:'mo',p,name,kind,tone,orb:o})}

  today.sort((a,b)=>a.orb-b.orb);
  return{up:out.filter(x=>x.ms>nowMs-day),today};
}

function wheel(pts,asc,hasAng,today){
  const C=200,R0=192,R1=160,RP=130,RA=98,pos=l=>{const th=(180-(l-asc))*D2R;return r=>[(C+r*Math.cos(th)).toFixed(1),(C-r*Math.sin(th)).toFixed(1)]};
  const gold='#e8c873',el=['#ff8a7c','#c9e39a','#f6e08a','#9cc6ff'];
  let s=`<defs><radialGradient id="wg"><stop offset="0" stop-color="#2a1f63"/><stop offset="1" stop-color="#120e33"/></radialGradient></defs><circle cx="200" cy="200" r="${R0}" fill="url(#wg)" stroke="${gold}" stroke-opacity=".7"/>`;
  for(let i=0;i<12;i++){const a1=pos(i*30)(R0),a2=pos(i*30)(R1);s+=`<line x1="${a1[0]}" y1="${a1[1]}" x2="${a2[0]}" y2="${a2[1]}" stroke="${gold}" stroke-opacity=".5"/>`;const m=pos(i*30+15)((R0+R1)/2);s+=`<text x="${m[0]}" y="${m[1]}" fill="${el[i%4]}" font-size="18" text-anchor="middle" dominant-baseline="central">${SG[i]}</text>`}
  s+=`<circle cx="200" cy="200" r="${R1}" fill="#0f0b2c" stroke="${gold}" stroke-opacity=".7"/><circle cx="200" cy="200" r="${RA}" fill="#0a0822" stroke="${gold}" stroke-opacity=".35"/>`;
  for(let d=0;d<360;d+=5){const a=pos(d)(R1),b=pos(d)(R1-(d%30?4:9));s+=`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${gold}" stroke-opacity=".45"/>`}
  if(hasAng){for(let i=0;i<12;i++){const l=signOf(asc)*30+i*30,a=pos(l)(RA),b=pos(l)(R1-12);s+=`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="#fff" stroke-opacity=".07"/>`;const n=pos(l+5)(RA+9);s+=`<text x="${n[0]}" y="${n[1]}" fill="#fff" fill-opacity=".35" font-size="9" text-anchor="middle" dominant-baseline="central">${i+1}</text>`}
    const A=pos(asc),D=pos(asc+180),M=pos(pts.mc),I=pos(pts.mc+180);
    s+=`<line x1="${A(R1)[0]}" y1="${A(R1)[1]}" x2="${D(R1)[0]}" y2="${D(R1)[1]}" stroke="${gold}" stroke-width="1.4"/><line x1="${M(R1)[0]}" y1="${M(R1)[1]}" x2="${I(R1)[0]}" y2="${I(R1)[1]}" stroke="${gold}" stroke-dasharray="3 3"/>`;
    const at=pos(asc)(R1-22),mt=pos(pts.mc)(R1-22);s+=`<text x="${at[0]}" y="${+at[1]-10}" fill="${gold}" font-size="11" font-weight="700" text-anchor="middle">AC</text><text x="${+mt[0]+12}" y="${mt[1]}" fill="${gold}" font-size="11" font-weight="700" text-anchor="middle">MC</text>`}
  const ks=Object.keys(pts).filter(k=>k!=='asc'&&k!=='mc');
  for(let i=0;i<ks.length;i++)for(let j=i+1;j<ks.length;j++){const d=Math.abs(wrap(pts[ks[i]]-pts[ks[j]]));for(const[A,,kind]of ASP){if(A===0)continue;if(Math.abs(d-A)<(A===60?4:6)){const a=pos(pts[ks[i]])(RA),b=pos(pts[ks[j]])(RA);s+=`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${kind==='hard'?'#ff7a6a':'#8fb0ff'}" stroke-opacity=".8" stroke-width="1.1"/>`}}}
  const sorted=ks.map(k=>({k,l:pts[k]})).sort((a,b)=>a.l-b.l),place=sorted.map(x=>x.l);
  for(let it=0;it<8;it++)for(let i=0;i<place.length;i++){const j=(i+1)%place.length;const d=wrap(place[j]-place[i]);if(d>=0&&d<9){place[i]-=(9-d)/2;place[j]+=(9-d)/2}}
  sorted.forEach((x,i)=>{const p=pos(place[i])(RP),t=pos(x.l)(R1-2),u=pos(place[i])(RP+13);s+=`<line x1="${t[0]}" y1="${t[1]}" x2="${u[0]}" y2="${u[1]}" stroke="#fff" stroke-opacity=".35"/><text x="${p[0]}" y="${p[1]}" fill="#fff" font-size="20" text-anchor="middle" dominant-baseline="central">${g(x.k)}</text>`});
  if(today)['su','mo','me','ve','ma','ju','sa','ur','ne','pl'].forEach(k=>{const p=pos(lonOf(k,Date.now()))(R0);s+=`<circle cx="${p[0]}" cy="${p[1]}" r="3.6" fill="#ff7a6a" stroke="#0c0a22"/>`});
  return `<svg viewBox="0 0 400 400" role="img" aria-label="Chart wheel" font-family="'Segoe UI Symbol','Noto Sans Symbols','Apple Symbols',Manrope,sans-serif">${s}</svg>`;
}

  const src=L.src==='account'?`Synced from your account (${esc(L.email)})`:L.src==='device'?'From the apps on this device. Sign in to see everything':L.src==='saved'?'Showing your last saved copy':'Nothing found yet';
  const now_=nowOf(L);
  const row=(title,app,items)=>items.length?`<div class="shelfrow"><h3>${title}<a href="${APPS[app]}">Open</a></h3><div class="ledge">${items.slice(0,24).map(x=>`<a class="spine" href="${APPS[app]}"><div class="cv">${cvr(x.c,x.t)}</div><p>${esc(x.t)}</p></a>`).join('')}</div><div class="wood"></div></div>`:'';
  const recent=[...L.books.filter(b=>b.st==='read'&&b.f).map(b=>({k:'Book',t:b.t,f:b.f,r:b.r})),...L.games.filter(g=>g.st==='finished'&&g.f).map(g=>({k:'Game',t:g.t,f:g.f,r:g.r})),...L.watch.filter(w=>w.st==='watched'&&w.f).map(w=>({k:w.ty==='tv'?'Show':'Film',t:w.t,f:w.f,r:w.r}))].sort((a,b)=>b.f.localeCompare(a.f)).slice(0,12);
  const fd=f=>/^\d{4}-\d{2}-\d{2}/.test(f)?fmtDate(f.slice(0,10)+'T12:00',{day:'numeric',month:'short',year:'numeric'}):f.slice(0,4);
  const stars=r=>r?'★'.repeat(Math.floor(r))+(r%1?'½':''):'';
  el.innerHTML=`<h1>Your shelf</h1><p class="src"><span>${src}</span><button type="button" id="den-r">Refresh</button>${L.signedIn?'<button type="button" id="den-out">Sign out</button>':''}</p>
  ${!L.signedIn?`<form class="signin" id="den-in"><b style="font:600 20px var(--lit)">Sign in with your Book Nook account</b><span class="small muted">The same email and password as Book Nook, Save Point and Front Row. Once you're signed in to one of them on this device, you're signed in here too.</span><input type="email" id="den-e" placeholder="Email" autocomplete="username" required><input type="password" id="den-p" placeholder="Password" autocomplete="current-password" required><div class="row"><button class="btn acc" type="submit">Sign in</button><span class="small" id="den-m"></span></div></form>`:''}
  ${any?`${now_.length?`<h2>Right now</h2><div class="nowg">${now_.map(n=>`<a class="nowc" href="${APPS[n.app]}"><div class="cv">${cvr(n.c,n.t)}</div><div><small>${n.k}</small><h3>${esc(n.t)}</h3><p>${esc(n.d)}</p>${n.pct!=null?`<div class="prog"><i style="width:${n.pct}%"></i></div>`:''}</div></a>`).join('')}</div>`:''}
  <h2>Your ${yr} so far</h2><div class="stats">
    <div class="stat"><b>${bF.length}</b><span>books finished</span></div>
    <div class="stat"><b>${bF.reduce((s,b)=>s+b.p,0).toLocaleString()}</b><span>pages read</span></div>
    <div class="stat"><b>${gF.length}</b><span>games finished</span></div>
    <div class="stat"><b>${Math.round(L.games.reduce((s,g)=>s+g.h,0)).toLocaleString()}</b><span>hours played, all time</span></div>
    <div class="stat"><b>${wF.filter(w=>w.ty!=='tv').length}</b><span>films watched</span></div>
    <div class="stat"><b>${wF.filter(w=>w.ty==='tv').length}</b><span>shows finished</span></div></div>
  <h2>Up next</h2>
  ${row('Want to read','books',L.books.filter(b=>b.st==='want'))}
  ${row('Wishlist and backlog','games',L.games.filter(g=>g.st==='wishlist'||g.st==='backlog'))}
  ${row('Watchlist','watch',L.watch.filter(w=>w.st==='want'))}
  ${recent.length?`<h2>Recently finished</h2><ul class="recent">${recent.map(r=>`<li><span class="k">${r.k}</span><span><b>${esc(r.t)}</b>${r.r?` <span class="muted small">${stars(r.r)}</span>`:''}</span><span class="d">${esc(fd(r.f))}</span></li>`).join('')}</ul>`:''}`
  :`<p class="muted" style="margin-top:18px">${L.signedIn?'Your account has no books, games or shows yet.':'Sign in above, or open this app on the same device where you use Book Nook, Save Point and Front Row.'}</p>`}
  <div class="apps"><a href="${APPS.books}">Book Nook</a><a href="${APPS.games}">Save Point</a><a href="${APPS.watch}">Front Row</a></div>`;
  $('#den-r').onclick=async()=>{LIB=null;libP=null;$('#den').innerHTML=viewShelf().replace(/^<div[^>]*>|<\/div>$/g,'');await loadLib(true);fillShelf()};
  const out=$('#den-out');if(out)out.onclick=async()=>{try{await (await sb()).auth.signOut()}catch(e){}LIB=null;libP=null;fillShelf()};
  const f=$('#den-in');if(f)f.onsubmit=async e=>{e.preventDefault();const m=$('#den-m');m.textContent='Signing in…';
    try{const c=await sb();const{error}=await c.auth.signInWithPassword({email:$('#den-e').value.trim(),password:$('#den-p').value});if(error)throw error;LIB=null;libP=null;fillShelf()}
    catch(err){m.textContent=/invalid/i.test(err?.message||'')?'That email and password don\'t match.':'Couldn\'t sign in right now. Check your connection.'}};
}
async function fillNowStrip(){
  const el=$('#nowstrip');if(!el)return;
  try{const L=await loadLib();const n=nowOf(L).slice(0,4);if(!n.length){el.remove();return}
    el.innerHTML=n.map(x=>`<a href="${APPS[x.app]}"><div class="cv">${cvr(x.c,x.t)}</div><div><small>${x.k}</small><b>${esc(x.t)}</b><span>${esc(x.d)}</span></div></a>`).join('');
  }catch(e){el.remove()}
}

// ---------- router ----------
const VIEWS={today:[viewToday,fillToday,'#2a1838'],news:[viewNews,fillNews,'#121212'],sky:[viewSky,null,'#0c0a22'],shelf:[viewShelf,fillShelf,'#1a110a'],releases:[viewReleases,fillReleases,'#111111'],saved:[viewSaved,null,'#5a3d22'],settings:[viewSettings,bindSettings,'#2a1838']};
let lastView='';
function render(){
  const v=(location.hash||'#today').slice(1),key=VIEWS[v]?v:'today';
  document.body.dataset.v=key;
  document.querySelector('meta[name=theme-color]').content=VIEWS[key][2];
  const st=$('#skystars');if(key==='sky'){if(!st.innerHTML)st.innerHTML=starField(4242,140);st.style.display=''}else st.style.display='none';
  document.querySelectorAll('#tabs a').forEach(a=>a.setAttribute('aria-current',a.getAttribute('href')==='#'+key?'page':'false'));
  const main=$('#view');
  try{main.innerHTML=VIEWS[key][0]()}catch(e){main.innerHTML=`<div class="wrap empty">Something went wrong showing this page.</div>`;console.error(e)}
  if(lastView!==key){window.scrollTo(0,0);lastView=key}
  if(VIEWS[key][1])Promise.resolve(VIEWS[key][1]()).catch(e=>console.error(e));
}
$('#bdate').textContent=now.toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'});
$('#gear').onclick=()=>{location.hash='#settings'};
window.addEventListener('hashchange',render);
render();
try{if('serviceWorker'in navigator&&location.protocol==='https:'&&!/claude|anthropic/.test(location.hostname))navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
}
</script>
</body>
